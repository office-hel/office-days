:root{
  --bg:#EAEFF3;--surface:#FFFFFF;--surface-2:#F2F5F8;
  --ink:#172335;--ink-2:#4A5A6D;--ink-3:#748294;--line:#DCE3EA;
  --green:#12804F;--green-strong:#0E6B41;--green-soft:#DDF1E6;--green-track:#C9E7D6;--on-green:#FFFFFF;--link:#0E6B41;
  --amber:#8F5300;--amber-soft:#FCEED4;
  --leave:#8B97A5;--leave-soft:#DFE5EC;
  --danger:#B23A28;--danger-soft:#FBE2DD;
  --focus:#2563EB;
  --shadow:0 1px 0 rgba(23,35,53,.04),0 10px 28px -16px rgba(23,35,53,.28);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B131D;--surface:#131E2C;--surface-2:#1A2738;
  --ink:#E7EDF4;--ink-2:#A9B6C4;--ink-3:#7A899B;--line:#243347;
  --green:#36B57C;--green-strong:#2E9E6B;--green-soft:#173628;--green-track:#1E4434;--on-green:#04170E;--link:#5BCB97;
  --amber:#F2B65A;--amber-soft:#3A2A10;
  --leave:#7C8A9A;--leave-soft:#253345;
  --danger:#F28472;--danger-soft:#3E1E19;
  --focus:#8AB4FF;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{display:block}
.muted{color:var(--ink-3)}
.link{color:var(--link);font-weight:650;font-size:15px;padding:8px 2px;white-space:nowrap}

/* hero */
.hero{position:relative;height:calc(env(safe-area-inset-top) + 352px);overflow:hidden;border-radius:0 0 30px 30px;color:#fff;isolation:isolate;background:#12233B}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg>svg{width:100%;height:100%}
.hero.ph-day{color:#0F2238}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,22,.66) 0%,rgba(6,12,22,.28) 58%,rgba(6,12,22,.5) 100%)}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 0 18px}
.brand{display:flex;align-items:center;gap:7px;font-weight:650;font-size:16px}
.hero-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero.ph-day .icon-btn{background:rgba(255,255,255,.55)}
.hero-copy{padding:16px 20px 0;max-width:66%}
.hero:not(.ph-day) .hero-copy{text-shadow:0 1px 16px rgba(0,0,0,.3)}
.hero-num{font-size:88px;line-height:.84;font-weight:700;letter-spacing:-.045em}
.hero-label{margin-top:12px;font-size:18px;line-height:1.22;font-weight:500}
.tw.rise{animation:winOn .55s ease-out both}
.tw.pop{animation:winPop 1.4s ease-out both}
@keyframes winOn{from{opacity:0}to{opacity:1}}
@keyframes winPop{0%{opacity:0}25%{opacity:1}45%{opacity:.55}65%{opacity:1}100%{opacity:1}}
.flag.rise{transform-box:fill-box;transform-origin:0 50%;animation:flagUp 1s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes flagUp{from{transform:translateY(22px) scaleX(.15);opacity:0}to{transform:none;opacity:1}}

/* install */
.install{margin:14px 16px 0;padding:12px 8px 12px 16px;border-radius:16px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35;box-shadow:var(--shadow)}
.install b{font-weight:650}
.install div{flex:1;padding-top:2px}
.x{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink-3)}

/* status */
.status{margin:16px 16px 0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr}
.kpi{padding:0 12px}
.kpi:first-child{padding-left:2px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi-label{font-size:13.5px;color:var(--ink-2)}
.kpi-value{font-size:27px;font-weight:650;letter-spacing:-.02em;margin-top:1px;line-height:1.15}
.kpi-value small{font-size:15px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.meter-wrap{position:relative;margin-top:30px}
.meter{display:flex;gap:3px;height:12px}
.meter i{flex:1;border-radius:3px;background:var(--green-track)}
.meter i.on{background:var(--green)}
.meter.bar{background:var(--green-track);border-radius:6px;overflow:hidden}
.meter.bar i{flex:none;border-radius:0;background:var(--green)}
.mark{position:absolute;top:-7px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mark span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:12.5px;font-weight:650;white-space:nowrap}
.meter-cap{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-3)}

/* today */
.today-card{margin:12px 16px 0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 16px}
.loc{display:flex;align-items:flex-start;gap:12px}
.loc-dot{position:relative;width:10px;height:10px;border-radius:50%;margin:6px 2px 0;background:var(--ink-3);flex:none}
.loc.inside .loc-dot{background:var(--green);box-shadow:0 0 0 5px var(--green-soft)}
.loc.warn .loc-dot{background:var(--amber)}
.loc.busy .loc-dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.loc-text{flex:1;min-width:0;font-size:15.5px;line-height:1.35}
.loc-title{font-weight:600}
.loc-sub{font-size:14px;color:var(--ink-2);margin-top:2px}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;min-height:54px;border-radius:16px;background:var(--green);color:var(--on-green);font-weight:650;font-size:17px;padding:0 16px;transition:transform .12s}
.primary:active{transform:scale(.98)}
.primary.soft{background:var(--green-soft);color:var(--green-strong)}
@media (prefers-color-scheme:dark){.primary.soft{color:var(--link)}}
.primary.leave{background:var(--surface-2);color:var(--ink-2)}
.note{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--surface-2);color:var(--ink-2);font-size:15.5px;text-align:center}

/* sections */
.section{margin:30px 16px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 10px}
.section h2{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0;line-height:1.2}
.lead{margin:-2px 4px 12px;color:var(--ink-2);font-size:15.5px;line-height:1.4}

/* calendar */
.cal-nav{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.cal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:10px 8px 10px 4px;touch-action:pan-y}
.cal-grid{display:grid;grid-template-columns:24px repeat(7,1fr);row-gap:2px}
.cal-wd{font-size:12.5px;color:var(--ink-3);text-align:center;padding:4px 0 6px;font-weight:500}
.cal-wk{font-size:11px;color:var(--ink-3);display:grid;place-items:center;opacity:.75}
.day{height:46px;width:100%;display:grid;place-items:center;font-size:16.5px;font-weight:500;border-radius:12px}
.day .n{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day.we .n{color:var(--ink-3)}
.day.past:not(.office):not(.we):not(.hol) .n{color:var(--ink-2)}
.day.hol .n{color:var(--amber);background:var(--amber-soft);font-weight:600}
.day.leave .n{color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--leave-soft) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--leave-soft)}
.day.office .n{background:var(--green);color:var(--on-green);font-weight:650}
.day.plan .n{box-shadow:inset 0 0 0 2px var(--green);color:var(--green-strong);font-weight:650}
@media (prefers-color-scheme:dark){.day.plan .n{color:var(--link)}}
.day.sug .n::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--green)}
.day.today .n{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.day.today.plan .n{box-shadow:inset 0 0 0 2px var(--green),0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.day.out{pointer-events:none}
.cal-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 4px 0;font-size:15px;color:var(--ink-2)}
.cal-tools.on{margin:10px 0 0;padding:6px 6px 6px 14px;border-radius:16px;background:var(--green-soft);color:var(--green-strong);font-weight:600}
@media (prefers-color-scheme:dark){.cal-tools.on{color:var(--link)}}
.pill{min-height:40px;padding:0 16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px;font-weight:650;color:var(--ink);white-space:nowrap}
.cal-tools.on .pill{background:var(--green);color:var(--on-green);box-shadow:none}
.cal.marking{box-shadow:0 0 0 2px var(--green),var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 6px 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.sw.office{background:var(--green)}
.sw.plan{box-shadow:inset 0 0 0 2px var(--green)}
.sw.sug{width:7px;height:7px;background:var(--green);margin:0 3.5px}
.sw.hol{background:var(--amber-soft);box-shadow:inset 0 0 0 1.5px var(--amber)}
.sw.leave{background:repeating-linear-gradient(135deg,var(--leave) 0 2px,transparent 2px 4px)}

/* plan */
.weeks{background:var(--surface);border-radius:22px}
.week{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;align-items:center;gap:12px;padding:12px 14px 12px 16px}
.week+.week{border-top:1px solid var(--line)}
.week-name{font-weight:600;font-size:15.5px}
.week-dates{font-size:13px;color:var(--ink-3)}
@media (max-width:370px){.week{gap:8px;padding:12px 12px 12px 14px;grid-template-columns:minmax(0,1fr) auto 52px}.dots{gap:4px}.dot{width:22px;height:22px}}
.dots{display:flex;gap:5px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface-2)}
.dot.office{background:var(--green);color:var(--on-green)}
.dot.go{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green);color:var(--green-strong)}
@media (prefers-color-scheme:dark){.dot.go{color:var(--link)}}
.dot.hol{background:var(--amber-soft);color:var(--amber)}
.dot.leave{background:repeating-linear-gradient(135deg,var(--leave-soft) 0 3px,transparent 3px 6px)}
.dot.past{opacity:.6}
.dot.outp{background:none;opacity:.35}
.dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.dot.today.go{box-shadow:inset 0 0 0 2px var(--green),0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.week-go{font-size:14.5px;font-weight:650;text-align:right;white-space:nowrap}
.week-go.quiet{font-weight:500;color:var(--ink-3)}
.week.more{grid-template-columns:1fr auto;color:var(--ink-2);font-size:14.5px}

/* what-if */
.sim{background:var(--surface);border-radius:22px;padding:14px 16px 16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:13px;padding:3px}
.seg button{min-height:38px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#2A3B52}}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 12px}
.step-btn{width:48px;height:48px;border-radius:50%;background:var(--surface-2);font-size:26px;line-height:1;display:grid;place-items:center;font-weight:500}
.step-btn:disabled{opacity:.35;cursor:default}
.step-val{text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.step-val small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.sim-result{margin:0 2px;font-size:16px;line-height:1.4}
.sim-result.bad{color:var(--danger)}
.sim-bar{display:flex;gap:2px;height:14px;margin-top:14px}
.sim-bar i{flex:1;border-radius:3px;min-width:2px}
.sim-bar .go{background:var(--green)}
.sim-bar .free{background:var(--green-track)}
.sim-bar .skip{background:repeating-linear-gradient(135deg,var(--leave) 0 2px,var(--leave-soft) 2px 5px)}
.sim-bar .miss{background:repeating-linear-gradient(135deg,var(--danger) 0 2px,var(--danger-soft) 2px 5px)}
.sim-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sim-legend span{display:inline-flex;align-items:center;gap:6px}
.sim-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* holidays */
.hols{background:var(--surface);border-radius:22px}
.hol-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px}
.hol-row+.hol-row{border-top:1px solid var(--line)}
.hol-name{font-weight:600}
.hol-en{font-size:13.5px;color:var(--ink-3)}
.hol-date{font-size:14.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.hol-date small{display:block;font-size:12.5px;color:var(--ink-3)}

.foot{margin:26px 20px 0;font-size:13.5px;color:var(--ink-3);text-align:center}
.foot p{margin:0}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(6,12,22,.46);opacity:0;transition:opacity .22s;z-index:50}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:51;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:22px;font-weight:650;margin:0;letter-spacing:-.015em}
.sheet-sub{color:var(--ink-3);font-size:14.5px;margin:2px 0 12px}
.sheet-note{margin:10px 0 4px;padding:14px 16px;border-radius:16px;background:var(--surface-2);color:var(--ink-2)}
.sheet-foot{margin:12px 2px 2px;font-size:14px;color:var(--ink-3)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--surface-2);margin-top:8px;text-align:left;font-size:16.5px;font-weight:550}
.opt small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
.welcome .primary{margin-top:24px}
.welcome .sheet-sub{font-size:15.5px;line-height:1.4;color:var(--ink-2);margin-top:8px}
.opt .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green)}
.opt.office .ic,.opt.plan .ic{color:var(--green)}
.opt[aria-pressed="true"] .ic{background:var(--green);color:var(--on-green)}
.opt.leave[aria-pressed="true"]{background:var(--leave-soft);box-shadow:inset 0 0 0 2px var(--leave)}
.opt.leave[aria-pressed="true"] .ic{background:var(--leave);color:#fff}
.close-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}

/* settings */
.set-group{margin-top:20px}
.set-label{font-size:14px;color:var(--ink-2);margin:0 2px 8px;font-weight:500}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:14px}
.set-row+.set-row{margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:44px;min-height:40px;padding:0 13px;border-radius:12px;background:var(--surface-2);font-size:15px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step button{width:38px;height:38px;border-radius:50%;background:var(--surface);font-size:22px;line-height:1}
.mini-step output{min-width:56px;text-align:center;font-size:20px;font-weight:650}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.spot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface-2);border-radius:14px;margin-top:6px}
.spot-name{font-weight:600}
.spot-sub{font-size:13px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--surface-2);font-weight:600;font-size:15.5px}
.btn.wide{width:100%;margin-top:8px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
textarea{width:100%;min-height:120px;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
.help h4{font-size:17px;margin:20px 0 4px;font-weight:650}
.help p{margin:0 0 6px;color:var(--ink-2);font-size:15.5px;line-height:1.45}
.help ol{margin:4px 0 6px;padding-left:20px;color:var(--ink-2);font-size:15.5px;line-height:1.5}

/* greeting + today rows */
.hero-hi{font-size:16px;font-weight:600;margin-bottom:10px;opacity:.95}
.loc+.loc{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.loc.small .loc-title{font-weight:500;font-size:14.5px}
.loc.small .loc-sub{font-size:13.5px}

/* start screens */
.wiz{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
@media (min-width:481px){.wiz{box-shadow:0 0 0 100vmax rgba(6,12,22,.55)}}
.wiz-art{flex:none;position:relative;height:min(40vh,320px);overflow:hidden;border-radius:0 0 30px 30px;background:#12233B}
.wiz-art>svg{position:absolute;inset:0;width:100%;height:100%}
.wiz-brand{position:absolute;left:20px;top:calc(env(safe-area-inset-top) + 16px);display:flex;align-items:center;gap:8px;color:#fff;font-weight:650;font-size:17px}
.wiz-art.ph-day .wiz-brand{color:#0F2238}
.wiz-top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 0 22px;min-height:56px}
.wiz-dots{display:flex;gap:6px}
.wiz-dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}
.wiz-dots i.done{background:var(--green-track)}
.wiz-dots i.on{width:22px;background:var(--green)}
.wiz-skip{font-size:15px;font-weight:600;color:var(--ink-3);padding:10px 8px}
.wiz-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 22px 12px}
.wiz h2{font-size:30px;line-height:1.12;letter-spacing:-.025em;margin:6px 0 10px;font-weight:700}
.wiz-lead{font-size:17px;line-height:1.45;color:var(--ink-2);margin:0 0 16px}
.wiz-small{font-size:14.5px;line-height:1.45;color:var(--ink-3);margin:12px 0 0}
.wiz-foot{flex:none;display:flex;gap:10px;align-items:center;padding:10px 20px calc(16px + env(safe-area-inset-bottom))}
.wiz-foot .primary{margin-top:0;flex:1}
.btn-back{min-height:54px;padding:0 18px;border-radius:16px;background:var(--surface);font-weight:650;font-size:16px;box-shadow:var(--shadow)}
.btn-text{min-height:54px;padding:0 10px;font-weight:650;font-size:16px;color:var(--ink-2)}
.field{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font-family:inherit;font-size:18px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--green)}
.field.mono{font:14px/1.3 ui-monospace,Menlo,monospace}
.wiz-points{list-style:none;padding:0;margin:4px 0 0}
.wiz-points li{position:relative;padding:7px 0 7px 28px;font-size:16.5px}
.wiz-points li::before{content:"";position:absolute;left:3px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--green)}
.steps{list-style:none;counter-reset:st;padding:0;margin:4px 0 0}
.steps li{position:relative;counter-increment:st;padding:12px 0 12px 42px;font-size:16px;line-height:1.45;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:11px;width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green-strong);font-weight:700;font-size:14px;display:grid;place-items:center}
@media (prefers-color-scheme:dark){.steps li::before{color:var(--link)}}
.copyrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--surface-2)}
.copyrow code{flex:1;min-width:0;font:12.5px/1.35 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--ink-2)}
.copyrow button{flex:none;min-height:36px;padding:0 12px;border-radius:10px;background:var(--surface);font-weight:650;font-size:14px;box-shadow:var(--shadow)}
.copy-label{font-size:13.5px;color:var(--ink-2);margin:10px 2px -2px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:4px;margin:4px 0 6px;text-align:center;font-size:13.5px;line-height:1.3;color:var(--ink-2)}
.flow .node{display:flex;flex-direction:column;align-items:center;gap:7px}
.flow .bub{width:54px;height:54px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--green)}
@media (prefers-color-scheme:dark){.flow .bub{color:var(--link)}}
.flow .arr{padding-top:16px;color:var(--ink-3);font-size:18px}
.wiz-status{min-height:22px;margin:10px 2px 0;font-size:15px;font-weight:600}
.wiz-status.ok{color:var(--green-strong)}
.wiz-status.bad{color:var(--danger)}
@media (prefers-color-scheme:dark){.wiz-status.ok{color:var(--link)}}
.wiz .seg{margin:4px 0 6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;margin-left:4px;vertical-align:middle}

/* install card + picture guide */
.install-card{margin:14px 16px 0;padding:12px 6px 12px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--green-track);display:flex;align-items:center;gap:12px}
.install-card img{width:46px;height:46px;border-radius:12px;flex:none}
.ic-text{flex:1;min-width:0;font-size:14px;line-height:1.3;color:var(--ink-2)}
.ic-text b{display:block;color:var(--ink);font-size:15.5px;font-weight:650;margin-bottom:2px}
.ic-btn{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--green);color:var(--on-green);font-weight:650;font-size:14.5px}
.install-card .x{width:32px;height:32px;font-size:20px}
.dg{width:120px;height:90px;flex:none}
.dg-frame{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.dg-line{fill:var(--line)}
.dg-btn{fill:var(--surface);stroke:var(--line);stroke-width:1}
.dg-card{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg-sheet{fill:var(--surface);stroke:var(--line);stroke-width:1}
.dg-dim{fill:var(--ink);opacity:.08}
.dg-hl{fill:var(--green)}
.dg-w{stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dg-wl{fill:#fff;opacity:.85}
.dg-dotw{fill:#fff}
.dg-i{stroke:var(--ink-3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dg-tap{fill:none;stroke:var(--green);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:tapRing 1.6s ease-out infinite}
@keyframes tapRing{0%{opacity:.95;transform:scale(.55)}100%{opacity:0;transform:scale(1.5)}}
.ig{display:flex;flex-direction:column;gap:10px;margin:6px 0 0}
.ig-row{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.ig-text{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4}
.ig-text b{font-weight:650}
.ig-num{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green-strong);font-weight:700;font-size:13px;margin-top:1px}
@media (prefers-color-scheme:dark){.ig-num{color:var(--link)}}
@media (max-width:370px){.dg{width:104px;height:78px}.ig-text{font-size:15px}}
.pointer{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--green-strong);font-weight:700;font-size:13.5px;line-height:1.2}
@media (prefers-color-scheme:dark){.pointer{color:var(--link)}}
.pointer svg{animation:bob 1.1s ease-in-out infinite}
.pointer.up{flex-direction:column-reverse}
.pointer.up svg{animation-name:bobUp}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes bobUp{50%{transform:translateY(-6px)}}
.wiz-hint{flex:none;display:flex;padding:0 22px calc(4px + env(safe-area-inset-bottom))}
.wiz-hint.center{justify-content:center}
.wiz-hint.right{justify-content:flex-end}
.wiz-foot.has-hint{padding-bottom:4px}
.rec{font-style:normal;font-size:12px;font-weight:700;color:var(--green-strong);background:var(--green-soft);padding:2px 8px;border-radius:9px;margin-left:6px;vertical-align:2px;white-space:nowrap}
@media (prefers-color-scheme:dark){.rec{color:var(--link)}}
.wiz-ok{margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--green-soft);color:var(--green-strong);font-weight:650}
@media (prefers-color-scheme:dark){.wiz-ok{color:var(--link)}}

.code-chip{display:inline-block;margin:2px 0;padding:1px 9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-family:inherit;font-size:15px;font-weight:650;color:var(--ink);line-height:1.55;vertical-align:baseline}
.code-chip:active{background:var(--green-soft)}
.ver{margin-top:6px!important;font-size:12.5px;opacity:.8}

/* weather */
#wxChip:empty{display:none}
.wx-chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 9px;border-radius:20px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:650;font-size:16.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;animation:wxIn .45s ease-out both}
.wx-chip svg{flex:none}
.hero.ph-day .wx-chip{background:rgba(255,255,255,.55)}
@keyframes wxIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:350px){.brand span{display:none}}
.wx-fall{animation:wxFall 1s linear infinite}
@keyframes wxFall{from{transform:translateY(0)}to{transform:translateY(540px)}}
.wx-sway{animation:wxSway 3.6s ease-in-out infinite alternate}
@keyframes wxSway{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.wx-drift{animation:wxDrift 34s ease-in-out infinite alternate}
@keyframes wxDrift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.wx-splash{transform-box:fill-box;transform-origin:center;animation:wxSplash 1s ease-out infinite}
@keyframes wxSplash{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.wx-flash{opacity:0;animation:wxFlash 7.5s linear infinite}
@keyframes wxFlash{0%,86%{opacity:0}87%{opacity:1}88%{opacity:.15}89.5%{opacity:.8}92%,100%{opacity:0}}
.wx-now{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.wx-ico{width:60px;height:60px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.wx-temp{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.wx-feels{font-size:15px;color:var(--ink-2);margin-top:4px}
.wx-src{font-size:13px;line-height:1.45}
.wx-src a{color:var(--link);font-weight:600}

/* welcome + what's new */
.wiz-art.short{height:min(30vh,240px)}
.wiz-kicker{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--green-strong);margin:6px 0 0}

.wiz .wiz-kicker + h2{margin-top:2px}
.feat{list-style:none;padding:0;margin:16px 0 4px;display:flex;flex-direction:column;gap:16px}

@media (prefers-color-scheme:dark){.feat .fi{color:var(--link)}}
.feat b{display:block;font-size:16.5px;font-weight:650;line-height:1.3}
.feat span.ft{display:block;font-size:15px;line-height:1.4;color:var(--ink-2);margin-top:1px}

.gd-x .btn.wide:first-child{margin-top:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script type="text/plain" id="gsCode">/**
 * Office Days: your private check-in link. Version 2.
 *
 * Set up once (about 5 minutes, easiest on a computer):
 *  1. Go to script.new, delete everything there, and paste this whole file.
 *  2. Click Deploy > New deployment. Click the gear next to "Select type" and pick "Web app".
 *  3. Set "Execute as" to Me and "Who has access" to Anyone. Click Deploy.
 *     If Google asks for permission, allow it. It is your own script.
 *  4. Copy the Web app URL and paste it into Office Days.
 *
 * Updating from version 1: paste this file over the old code and click Save. Then click
 * Deploy > Manage deployments > the pencil > Version: New version > Deploy. Your URL stays the same.
 *
 * How it is used:
 *  - Your phone opens  URL?a=in  when you arrive at the office and  URL?a=out  when you leave.
 *    A day counts once you have been there for 5 minutes, so walking past doesn't count
 *    (unless you turned on "Count quick visits too" in the app).
 *  - With "Just remind me", your phone opens  URL?a=hi  when you arrive. That only answers.
 *  - Arrivals answer with a notification text at most once a day. After that they answer
 *    with a quiet line, and your phone only shows answers that mention the office.
 *  - A morning reminder opens  URL?a=today  and shows the answer as a notification.
 *  - The Office Days app reads  URL?a=list  and saves your plan with  URL?a=plan.
 *
 * Only someone with your exact URL can use it, so keep it private.
 */
var VERSION = 2;
var KEEP_DAYS = 400;
var STAY_MIN = 5;
var QUIET = '✓ Already noted today';

function doGet(e) {
  var p = (e && e.parameter) || {};
  var store = PropertiesService.getScriptProperties();
  var now = Date.now();
  switch (p.a) {
    case 'in':
      store.setProperty('t' + now, '1');
      prune_(store, now);
      return text_(hello_(store, now, false));
    case 'out':
      store.setProperty('o' + now, '1');
      prune_(store, now);
      return text_('ok');
    case 'hi':
      return text_(hello_(store, now, true));
    case 'today':
      return text_(today_(store, now));
    case 'list':
      return json_(p, { ok: true, v: VERSION, checkins: stamps_(store, 't'), outs: stamps_(store, 'o') });
    case 'plan':
      store.setProperty('plan', JSON.stringify({
        p: dates_(p.p), o: dates_(p.o), t: Math.max(0, Number(p.t) || 0),
        tz: p.tz || Session.getScriptTimeZone(), pn: String(p.pn || 'this month').slice(0, 30),
        ps: p.ps || '', pe: p.pe || '', n: String(p.n || '').slice(0, 40), q: String(p.q) === '1' ? 1 : 0, at: now
      }));
      return json_(p, { ok: true, v: VERSION });
    default:
      return json_(p, { ok: true, app: 'office-days', v: VERSION });
  }
}

// What your phone shows when you arrive: a message at most once a day.
// (If that first arrival was only walking past, the next real one gets a message again.)
function hello_(store, now, remindOnly) {
  var plan = plan_(store), tz = plan ? plan.tz : Session.getScriptTimeZone(), day = day_(now, tz);
  if (plan && plan.o.indexOf(day) >= 0) return QUIET;   // today already counts
  var said = Number(store.getProperty('said')) || 0;
  if (said && day_(said, tz) === day && !passedBy_(store, said)) return QUIET;
  store.setProperty('said', String(now));
  if (remindOnly) return 'You’re at the office 🏢 Open Office Days and it marks today for you.';
  if (plan && plan.q) return 'You’re at the office 🏢 Today counts as an office day.';
  return 'You’re at the office 🏢 Today counts after ' + STAY_MIN + ' minutes here. Open Office Days to count it now.';
}

// True if you left again within STAY_MIN minutes of arriving at time t.
function passedBy_(store, t) {
  return stamps_(store, 'o').some(function (o) { return o > t && o - t < STAY_MIN * 60000; });
}

function stamps_(store, prefix) {
  var all = store.getProperties(), list = [], re = new RegExp('^' + prefix + '\\d+$');
  Object.keys(all).forEach(function (k) { if (re.test(k)) list.push(Number(k.slice(1))); });
  return list.sort(function (a, b) { return a - b; });
}

// Arrivals that count: the first departure after them is at least STAY_MIN minutes later
// (or you haven't left yet, and it's been that long). With "count quick visits" every arrival counts.
function stays_(store, now, min) {
  var outs = stamps_(store, 'o');
  return stamps_(store, 't').filter(function (t) {
    var end = now;
    for (var i = 0; i < outs.length; i++) if (outs[i] > t) { end = outs[i]; break; }
    return end - t >= (min === undefined ? STAY_MIN : min) * 60000;
  });
}

function prune_(store, now) {
  ['t', 'o'].forEach(function (prefix) {
    stamps_(store, prefix).forEach(function (ts) {
      if (ts < now - KEEP_DAYS * 864e5) store.deleteProperty(prefix + ts);
    });
  });
}

function plan_(store) {
  try { return JSON.parse(store.getProperty('plan') || 'null'); } catch (err) { return null; }
}

function day_(ts, tz) { return Utilities.formatDate(new Date(ts), tz, 'yyyy-MM-dd'); }

// Office days still needed: the app's count when it last saved the plan,
// plus weekday stays that came after that.
function need_(store, plan, now) {
  var seen = {}, count = 0;
  plan.o.forEach(function (d) { if (!seen[d]) { seen[d] = true; count++; } });
  stays_(store, now, plan.q ? 0 : STAY_MIN).forEach(function (ts) {
    if (ts <= plan.at) return;
    var d = day_(ts, plan.tz), wd = Number(Utilities.formatDate(new Date(ts), plan.tz, 'u'));
    if (seen[d] || wd > 5 || (plan.ps && d < plan.ps) || (plan.pe && d > plan.pe)) return;
    seen[d] = true; count++;
  });
  return Math.max(0, plan.t - count);
}

function today_(store, now) {
  var plan = plan_(store);
  if (!plan) return 'Open Office Days once so your reminder knows your plan.';
  var hi = plan.n ? 'Hi ' + plan.n + '! ' : '';
  var day = day_(now, plan.tz);
  if (plan.pe && day > plan.pe) return hi + 'Your plan for ' + plan.pn + ' has ended. Open Office Days to plan the next one.';
  var need = need_(store, plan, now);
  if (!need) return hi + 'Target reached for ' + plan.pn + ' 🎉 The office is optional today.';
  if (plan.p.indexOf(day) >= 0) return hi + 'Office day today 🏢 ' + need + ' more to go in ' + plan.pn + '.';
  return hi + 'No office planned today. ' + need + ' more to go in ' + plan.pn + '.';
}

function dates_(s) {
  return s ? String(s).split(',').filter(function (x) { return /^\d{4}-\d{2}-\d{2}$/.test(x); }).slice(0, 400) : [];
}

function text_(s) { return ContentService.createTextOutput(s); }

function json_(p, obj) {
  var body = JSON.stringify(obj), cb = p.callback;
  if (cb && /^[A-Za-z_$][\w$]{0,63}$/.test(cb)) {
    return ContentService.createTextOutput(cb + '(' + body + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(body).setMimeType(ContentService.MimeType.JSON);
}
</script>

<script>
(function () {
'use strict';

/* ============ constants ============ */
var STORE_KEY = 'officeDays.v1';
var PHOTO_KEY = 'officeDays.photo.v1';
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON3 = MONTHS.map(function (m) { return m.slice(0, 3); });
var WD_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var WD_1 = ['M','T','W','T','F','S','S'];
var APP_VERSION = '1.1';
var WIZ_STEPS = ['hello', 'install', 'opennow', 'name', 'office', 'target', 'auto', 'link', 'phone', 'fix', 'leave', 'remind', 'news', 'script', 'area', 'features', 'done'];
var CUTOFF_HOUR = 17;          // after this, an unlogged today no longer counts as "left"
var OFFICE_LAT = 60.1898, OFFICE_LNG = 24.9575;

function openHelp() {

  h += '<h4>Automatic check-in</h4><p>No web app can watch your location in the background, on any phone. So your phone’s own automation does it, even when this app is closed. When you arrive, it tells your private link. ' + (S().quick ? 'Every arrival counts, even a quick one.' : 'The day counts after 5 minutes at the office, so walking past doesn’t count.') + ' You get at most one notification a day.</p>';
  h += FRAMED ? '<p>This preview runs inside Claude, which blocks it. Put your own copy of the app online (GitHub Pages is free), open that link, and follow the start screens.</p>' : '<p><button class="btn" data-act="wizAuto">' + (S().link ? 'Show the setup steps' : 'Set it up') + '</button></p>';
  if (!FRAMED) h += '<h4>Quick visits</h4><p>Popped in for a minute to tap your card? A visit under 5 minutes looks like walking past, so it doesn’t count by itself. The app asks you about it on the Today card. You can also open the app while you’re there, or turn on “Count quick visits too” in Settings.</p>';
  h += '<h4>Just open the app</h4><p>At the office, open Office Days. It checks that you’re within ' + S().radius + ' m of ' + (hasCampus() ? 'any Nordea campus building (' + CAMPUS_ADDR + ')' : 'your office') + ' and marks today right away. Any entrance works.</p>';
  if (!FRAMED) h += '<h4>Weather</h4><p>The picture at the top shows the weather where you are right now: sun, clouds, rain, sleet, snow, fog, evening or night. Tap the temperature for details. Your location is rounded to about 100 m and only used to look up the weather.</p>';
  h += '<h4>Add days you missed</h4><p>Tap any day in the calendar and choose “I was in the office”. To fix many days at once, tap “Mark several days”, then tap each day.</p>';
  h += '<h4>Location is blocked or keeps asking</h4><p>iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using the App, with Precise Location on. Android: allow location for Chrome.</p>';
  h += '<h4>How the target is counted</h4><p>Working days are Monday to Friday, minus Finnish public holidays' + (S().eves ? ', Midsummer Eve and Christmas Eve' : '') + ', minus your leave days. The target is ' + S().target + '% of them, rounded down to a whole day. For example, ' + S().target + '% of 21 days is ' + String(Math.round(21 * S().target / 10) / 10) + ', so you need ' + tgt(21) + '.</p><p>After 5 pm, today no longer counts as a day left, unless you were in the office.</p>';
  h += '<h4>Leave, sick days and vacations</h4><p>One day: tap it in the calendar and choose “Leave or sick day”. Several days, like a vacation: tap “Add leave” under the calendar and pick the first and the last day. Weekends and holidays are skipped.</p><p>Leave days don’t count as working days, so you need fewer office days.</p>';

  h += '<p style="margin-top:18px"><button class="btn" data-act="tour">What Office Days can do</button></p>';
  h += '</div>';
  openSheet('help', h);
}
